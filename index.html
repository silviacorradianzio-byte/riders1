<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strapizzami Rider</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #121212; color: #fff; margin: 0; padding: 15px; }
    h1 { font-size: 1.4rem; color: #ff9800; text-align: center; margin-bottom: 20px; }
    .card { background: #1e1e1e; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #333; }
    input, button { width: 100%; padding: 12px; margin: 6px 0; border-radius: 8px; border: none; box-sizing: border-box; font-size: 1rem; }
    input { background: #2a2a2a; color: #fff; border: 1px solid #444; }
    button { background: #ff9800; color: #000; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .cliente-item { background: #2a2a2a; padding: 12px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #ff9800; }
    .actions { display: flex; gap: 8px; margin-top: 10px; }
    .actions a { flex: 1; text-align: center; padding: 10px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 0.9rem; }
    .btn-call { background: #4caf50; color: white; }
    .btn-map { background: #2196f3; color: white; }
  </style>
</head>
<body>

  <h1>🍕 Strapizzami Delivery</h1>

  <div class="card">
    <h3>Aggiungi / Cerca Cliente</h3>
    <input type="text" id="nome" placeholder="Nome e Cognome (es. Mario Rossi)">
    <input type="text" id="indirizzo" placeholder="Indirizzo (es. Via Eschieto 1)">
    <input type="tel" id="telefono" placeholder="Telefono (es. 3803620178)">
    <input type="text" id="note" placeholder="Note (es. citofono, piano)">
    <button id="btnSalva">Salva Cliente</button>
  </div>

  <div class="card">
    <h3>Clienti Salvati</h3>
    <input type="text" id="ricerca" placeholder="🔍 Cerca per nome o via...">
    <div id="listaClienti" style="margin-top: 10px;">Caricamento in corso...</div>
  </div>

  <!-- Firebase SDK per Realtime Database -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Inserisci solo l'apiKey presa da Firebase (Impostazioni Progetto)
    const firebaseConfig = {
      apiKey: "INSERISCI_LA_TUA_API_KEY", 
      databaseURL: "https://rider-strapizzami-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const clientiRef = ref(db, 'clienti');

    let tuttiClienti = [];

    // Salva nuovo cliente
    document.getElementById("btnSalva").addEventListener("click", () => {
      const nome = document.getElementById("nome").value;
      const indirizzo = document.getElementById("indirizzo").value;
      const telefono = document.getElementById("telefono").value;
      const note = document.getElementById("note").value;

      if (!nome || !indirizzo || !telefono) {
        alert("Compila almeno Nome, Indirizzo e Telefono!");
        return;
      }

      push(clientiRef, {
        nome, indirizzo, telefono, note,
        data: new Date().toISOString()
      });

      document.getElementById("nome").value = "";
      document.getElementById("indirizzo").value = "";
      document.getElementById("telefono").value = "";
      document.getElementById("note").value = "";
    });

    // Ascolta gli aggiornamenti in tempo reale
    onValue(clientiRef, (snapshot) => {
      tuttiClienti = [];
      const data = snapshot.val();
      if (data) {
        Object.keys(data).forEach(key => {
          tuttiClienti.push(data[key]);
        });
      }
      mostraClienti(tuttiClienti);
    });

    function mostraClienti(lista) {
      const cont = document.getElementById("listaClienti");
      if (lista.length === 0) {
        cont.innerHTML = "<p style='color:#888;'>Nessun cliente salvato.</p>";
        return;
      }
      cont.innerHTML = "";
      lista.reverse().forEach(c => {
        cont.innerHTML += `
          <div class="cliente-item">
            <strong>${c.nome}</strong><br>
            📍 ${c.indirizzo}<br>
            📞 ${c.telefono}<br>
            ${c.note ? `<small style="color:#aaa;">📝 ${c.note}</small><br>` : ''}
            <div class="actions">
              <a href="tel:${c.telefono}" class="btn-call">Chiama</a>
              <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c.indirizzo + ' Nettuno')}" target="_blank" class="btn-map">Mappa</a>
            </div>
          </div>
        `;
      });
    }

    // Ricerca rapida
    document.getElementById("ricerca").addEventListener("input", (e) => {
      const q = e.target.value.toLowerCase();
      const filtrati = tuttiClienti.filter(c => 
        c.nome.toLowerCase().includes(q) || c.indirizzo.toLowerCase().includes(q)
      );
      mostraClienti(filtrati);
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strapizzami Live Map & Route Optimizer</title>

  <!-- Leaflet CSS per la Mappa -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #000; color: #fff; margin: 0; padding: 15px; }
    h1 { font-size: 1.3rem; color: #f78bee; text-align: center; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #333; padding-bottom: 10px; }
    
    #map { height: 350px !important; width: 100%; border-radius: 12px; margin-bottom: 15px; border: 1px solid #333; background: #222; }

    .card { background: #111; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #222; }
    .card h3 { margin-top: 0; color: #eee; font-size: 1.1rem; }
    input, button { width: 100%; padding: 12px; margin: 6px 0; border-radius: 8px; border: none; box-sizing: border-box; font-size: 1rem; }
    input { background: #222; color: #fff; border: 1px solid #333; }
    input:focus { border-color: #f78bee; outline: none; }
    button { background: #fff; color: #000; font-weight: bold; cursor: pointer; margin-top: 10px; border-radius: 8px; }
    
    /* Box Ottimizzatore Giro */
    .btn-optimize { background: #f78bee !important; color: #000 !important; font-size: 1.05rem; padding: 14px; margin-bottom: 10px; }
    #percorsoRisultato { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 12px; margin-top: 10px; display: none; }
    .tappa-item { padding: 6px 0; border-bottom: 1px solid #2a2a2a; font-size: 0.95rem; }
    .tappa-item:last-child { border-bottom: none; }

    /* Picker a 15 Colori */
    .color-picker-container { margin: 10px 0; }
    .color-picker-label { font-size: 0.85rem; color: #888; margin-bottom: 8px; display: block; }
    .color-options { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; justify-items: center; }
    .color-btn { width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; margin: 0; }
    .color-btn.selected { border-color: #fff; transform: scale(1.18); box-shadow: 0 0 8px rgba(255,255,255,0.5); }

    /* Schede Clienti con Checkbox */
    .cliente-item { background: #111; padding: 14px; border-radius: 10px; margin-bottom: 12px; border: 1px solid #222; position: relative; }
    .checkbox-select { width: 22px; height: 22px; float: right; cursor: pointer; accent-color: #f78bee; }
    .badge-zona { color: #fff; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; display: inline-block; margin-bottom: 8px; }
    .badge-orario { background: #f78bee; color: #000; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; display: inline-block; margin-bottom: 8px; margin-left: 5px; }

    /* Azioni */
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    .actions a, .actions button { flex: 1; text-align: center; padding: 10px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 0.85rem; border: none; cursor: pointer; }
    .btn-call { background: #2e7d32 !important; color: #fff !important; } 
    .btn-map { background: #1565c0 !important; color: #fff !important; }  
    .btn-edit { background: #333 !important; color: #fff !important; flex: 0.6 !important; }
    .btn-delete { background: #222 !important; color: #ff5252 !important; flex: 0.4 !important; border: 1px solid #333 !important; }
  </style>
</head>
<body>

  <h1>🍕 Strapizzami Live Map</h1>

  <!-- MAPPA INTERATTIVA -->
  <div id="map"></div>

  <!-- PANNELLO OTTIMIZZAZIONE GIRO -->
  <div class="card">
    <h3>🚀 Ottimizzatore Giro Consegne</h3>
    <p style="font-size:0.85rem; color:#aaa; margin-top:-5px;">Seleziona i clienti con la spunta in basso e calcola il percorso in base all'orario e alla strada migliore.</p>
    <button id="btnCalcolaGiro" class="btn-optimize">⚡ Calcola Sequenza Ideale</button>
    
    <div id="percorsoRisultato">
      <strong style="color:#f78bee;">📍 Ordine Consegne Consigliato:</strong>
      <div id="listaTappe" style="margin-top:8px;"></div>
    </div>
  </div>

  <div class="card">
    <h3 id="formTitle">Aggiungi / Modifica Cliente</h3>
    <input type="hidden" id="editId">
    <input type="text" id="nome" placeholder="Nome e Cognome (es. Mario Rossi)">
    <input type="text" id="indirizzo" placeholder="Indirizzo (es. Via Eschieto 1)">
    <input type="text" id="zona" placeholder="Zona / Quartiere (es. Cretarossa, Poligono)">
    <input type="time" id="orario" placeholder="Orario Consegna (es. 20:00)">
    
    <div class="color-picker-container">
      <span class="color-picker-label">Colore Badge e Marker Mappa:</span>
      <div class="color-options">
        <button type="button" class="color-btn selected" style="background:#f78bee" data-color="#f78bee"></button>
        <button type="button" class="color-btn" style="background:#f44336" data-color="#f44336"></button>
        <button type="button" class="color-btn" style="background:#e91e63" data-color="#e91e63"></button>
        <button type="button" class="color-btn" style="background:#9c27b0" data-color="#9c27b0"></button>
        <button type="button" class="color-btn" style="background:#673ab7" data-color="#673ab7"></button>
        <button type="button" class="color-btn" style="background:#3f51b5" data-color="#3f51b5"></button>
        <button type="button" class="color-btn" style="background:#2196f3" data-color="#2196f3"></button>
        <button type="button" class="color-btn" style="background:#03a9f4" data-color="#03a9f4"></button>
        <button type="button" class="color-btn" style="background:#00bcd4" data-color="#00bcd4"></button>
        <button type="button" class="color-btn" style="background:#009688" data-color="#009688"></button>
        <button type="button" class="color-btn" style="background:#4caf50" data-color="#4caf50"></button>
        <button type="button" class="color-btn" style="background:#8bc34a" data-color="#8bc34a"></button>
        <button type="button" class="color-btn" style="background:#cddc39" data-color="#cddc39"></button>
        <button type="button" class="color-btn" style="background:#ffeb3b" data-color="#ffeb3b"></button>
        <button type="button" class="color-btn" style="background:#795548" data-color="#795548"></button>
      </div>
    </div>

    <input type="tel" id="telefono" placeholder="Telefono (es. 3803620178)">
    <input type="text" id="note" placeholder="Note (es. citofono, scala B)">
    
    <button id="btnSalva">Salva Cliente e Posiziona</button>
    <button id="btnAnnulla" style="display:none; background:#222; color:#fff; border:1px solid #333;">Annulla Modifica</button>
  </div>

  <div class="card">
    <h3>Clienti Salvati</h3>
    <input type="text" id="ricerca" placeholder="🔍 Cerca per nome, via, zona, orario o numero...">
    <div id="listaClienti" style="margin-top: 10px;">Caricamento in corso...</div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDu0IDYZ-ILUCgGqE2AhfwsNaWGtJol5F8",
      authDomain: "rider-strapizzami.firebaseapp.com",
      databaseURL: "https://rider-strapizzami-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const clientiRef = ref(db, 'clienti');

    const STRAPIZZAMI_POS = { lat: 41.4648, lon: 12.6688, nome: "Strapizzami (Via Cervino)" };

    let tuttiClienti = [];
    let coloreSelezionato = "#f78bee";
    let map, markersGroup, polylineRoute;

    function initMap() {
      map = L.map('map').setView([STRAPIZZAMI_POS.lat, STRAPIZZAMI_POS.lon], 14);
      
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19
      }).addTo(map);

      markersGroup = L.layerGroup().addTo(map);
      setTimeout(() => { map.invalidateSize(); }, 400);
    }

    initMap();

    // Selezione Colore
    document.querySelectorAll('.color-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
        e.target.classList.add('selected');
        coloreSelezionato = e.target.getAttribute('data-color');
      });
    });

    async function geocodeAddress(address) {
      try {
        const query = encodeURIComponent(address + ", Nettuno, Italy");
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${query}`);
        const data = await res.json();
        if (data && data.length > 0) {
          return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
        }
      } catch (e) {
        console.error("Geocoding error", e);
      }
      return null;
    }

    // Salva o Modifica Cliente
    document.getElementById("btnSalva").addEventListener("click", async () => {
      const editId = document.getElementById("editId").value;
      const nome = document.getElementById("nome").value.trim();
      const indirizzo = document.getElementById("indirizzo").value.trim();
      const zona = document.getElementById("zona").value.trim();
      const orario = document.getElementById("orario").value;
      const telefono = document.getElementById("telefono").value.trim();
      const note = document.getElementById("note").value.trim();

      if (!nome || !indirizzo || !telefono) {
        alert("Compila almeno Nome, Indirizzo e Telefono!");
        return;
      }

      const coords = await geocodeAddress(indirizzo);

      const payload = {
        nome, indirizzo, zona, orario,
        coloreZona: coloreSelezionato,
        telefono, note,
        lat: coords ? coords.lat : null,
        lon: coords ? coords.lon : null,
        data: new Date().toISOString()
      };

      if (editId) {
        set(ref(db, 'clienti/' + editId), payload);
      } else {
        push(clientiRef, payload);
      }

      resetForm();
    });

    document.getElementById("btnAnnulla").addEventListener("click", resetForm);

    function resetForm() {
      document.getElementById("editId").value = "";
      document.getElementById("nome").value = "";
      document.getElementById("indirizzo").value = "";
      document.getElementById("zona").value = "";
      document.getElementById("orario").value = "";
      document.getElementById("telefono").value = "";
      document.getElementById("note").value = "";
      document.getElementById("formTitle").innerText = "Aggiungi / Modifica Cliente";
      document.getElementById("btnSalva").innerText = "Salva Cliente e Posiziona";
      document.getElementById("btnAnnulla").style.display = "none";
    }

    onValue(clientiRef, (snapshot) => {
      tuttiClienti = [];
      const data = snapshot.val();
      if (data) {
        Object.keys(data).forEach(key => {
          tuttiClienti.push({ id: key, ...data[key] });
        });
      }
      mostraClienti(tuttiClienti);
      aggiornaMappa(tuttiClienti);
    });

    function aggiornaMappa(lista) {
      markersGroup.clearLayers();

      lista.forEach(c => {
        if (c.lat && c.lon) {
          const color = c.coloreZona || "#f78bee";
          const customMarker = L.divIcon({
            className: 'custom-pin',
            html: `<div style="background-color:${color}; width:16px; height:16px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 5px #000;"></div>`,
            iconSize: [16, 16],
            iconAnchor: [8, 8]
          });

          const marker = L.marker([c.lat, c.lon], { icon: customMarker });
          marker.bindPopup(`
            <div style="color:#000;">
              <strong>${c.nome}</strong> ${c.orario ? `<b style="color:#f78bee;">(${c.orario})</b>` : ''}<br>
              📍 ${c.indirizzo}<br>
              📞 <a href="tel:${c.telefono}">${c.telefono}</a><br>
              ${c.note ? `<small>📝 ${c.note}</small>` : ''}
            </div>
          `);
          markersGroup.addLayer(marker);
        }
      });
    }

    function mostraClienti(lista) {
      const cont = document.getElementById("listaClienti");
      if (lista.length === 0) {
        cont.innerHTML = "<p style='color:#666;'>Nessun cliente trovato.</p>";
        return;
      }
      cont.innerHTML = "";
      lista.slice().reverse().forEach(c => {
        const bgZona = c.coloreZona || "#333";
        const textColor = bgZona === "#ffeb3b" ? "#000" : "#fff";

        cont.innerHTML += `
          <div class="cliente-item">
            <input type="checkbox" class="checkbox-select" data-id="${c.id}">
            ${c.zona ? `<span class="badge-zona" style="background:${bgZona}; color:${textColor};">📍 ${c.zona}</span>` : ''}
            ${c.orario ? `<span class="badge-orario">🕒 ${c.orario}</span>` : ''}<br>
            <strong style="font-size:1.05rem;">${c.nome}</strong><br>
            <span style="color:#ccc;">🏠 ${c.indirizzo}</span><br>
            <span style="color:#ccc;">📞 ${c.telefono}</span><br>
            ${c.note ? `<small style="color:#888;">📝 ${c.note}</small><br>` : ''}
            <div class="actions">
              <a href="tel:${c.telefono}" class="btn-call">Chiama</a>
              <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c.indirizzo + ' Nettuno')}" target="_blank" class="btn-map">Mappa</a>
              <button onclick="preparaModifica('${c.id}')" class="btn-edit">✏️ Modifica</button>
              <button onclick="eliminaCliente('${c.id}')" class="btn-delete">🗑️</button>
            </div>
          </div>
        `;
      });
    }

    function calcolaDistanza(p1, p2) {
      const R = 6371;
      const dLat = (p2.lat - p1.lat) * Math.PI / 180;
      const dLon = (p2.lon - p1.lon) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(p1.lat * Math.PI / 180) * Math.cos(p2.lat * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // OTTIMIZZATORE CON PRIORITÀ AD ORARIO E STRADA
    document.getElementById("btnCalcolaGiro").addEventListener("click", () => {
      const selezionati = Array.from(document.querySelectorAll('.checkbox-select:checked'))
                               .map(cb => tuttiClienti.find(c => c.id === cb.getAttribute('data-id')))
                               .filter(c => c && c.lat && c.lon);

      if (selezionati.length === 0) {
        alert("Seleziona almeno 1 cliente spuntando la casella in alto a destra nella sua scheda!");
        return;
      }

      // 1. Raggruppa i clienti per fascia oraria
      let gruppiOrario = {};
      selezionati.forEach(c => {
        let key = c.orario || "23:59";
        if (!gruppiOrario[key]) gruppiOrario[key] = [];
        gruppiOrario[key].push(c);
      });

      // Ordinamento fasce orarie (es. 20:00 prima di 20:20)
      let orariOrdinati = Object.keys(gruppiOrario).sort();

      let puntoAttuale = STRAPIZZAMI_POS;
      let percorsoOrdinato = [];
      let latLngsPolyline = [[STRAPIZZAMI_POS.lat, STRAPIZZAMI_POS.lon]];

      // 2. Per ogni fascia oraria, trova il percorso più breve tra i punti di quella fascia
      orariOrdinati.forEach(orarioKey => {
        let daVisitare = [...gruppiOrario[orarioKey]];

        while (daVisitare.length > 0) {
          let piuVicinoIdx = 0;
          let distMinima = Infinity;

          for (let i = 0; i < daVisitare.length; i++) {
            let dist = calcolaDistanza(puntoAttuale, daVisitare[i]);
            if (dist < distMinima) {
              distMinima = dist;
              piuVicinoIdx = i;
            }
          }

          let prossimo = daVisitare.splice(piuVicinoIdx, 1)[0];
          percorsoOrdinato.push(prossimo);
          latLngsPolyline.push([prossimo.lat, prossimo.lon]);
          puntoAttuale = prossimo;
        }
      });

      // Ritorno in Pizzeria
      latLngsPolyline.push([STRAPIZZAMI_POS.lat, STRAPIZZAMI_POS.lon]);

      // Mostra Risultato Testuale
      const contRisultati = document.getElementById("listaTappe");
      contRisultati.innerHTML = `
        <div class="tappa-item" style="color:#aaa;">
          <b>🏁 START:</b> Strapizzami (Via Cervino)
        </div>
      `;
      
      percorsoOrdinato.forEach((c, idx) => {
        contRisultati.innerHTML += `
          <div class="tappa-item">
            <b style="color:#f78bee;">${idx + 1}° TAPPA:</b> <b>${c.nome}</b> ${c.orario ? `<span style="color:#f78bee;">[🕒 ${c.orario}]</span>` : ''}<br>
            🏠 ${c.indirizzo} ${c.zona ? `(${c.zona})` : ''} | 📞 <a href="tel:${c.telefono}" style="color:#4caf50;">${c.telefono}</a>
          </div>
        `;
      });

      contRisultati.innerHTML += `
        <div class="tappa-item" style="color:#f78bee; font-weight:bold;">
          🏁 RITORNO: Rientro in Pizzeria
        </div>
      `;

      document.getElementById("percorsoRisultato").style.display = "block";

      // Disegna il percorso rosa sulla mappa
      if (polylineRoute) map.removeLayer(polylineRoute);
      polylineRoute = L.polyline(latLngsPolyline, { color: '#f78bee', weight: 4, dashArray: '6, 8' }).addTo(map);
      map.fitBounds(polylineRoute.getBounds(), { padding: [30, 30] });
    });

    window.preparaModifica = function(id) {
      const c = tuttiClienti.find(item => item.id === id);
      if (!c) return;

      document.getElementById("editId").value = c.id;
      document.getElementById("nome").value = c.nome || "";
      document.getElementById("indirizzo").value = c.indirizzo || "";
      document.getElementById("zona").value = c.zona || "";
      document.getElementById("orario").value = c.orario || "";
      document.getElementById("telefono").value = c.telefono || "";
      document.getElementById("note").value = c.note || "";

      coloreSelezionato = c.coloreZona || "#f78bee";
      document.querySelectorAll('.color-btn').forEach(b => {
        if (b.getAttribute('data-color') === coloreSelezionato) b.classList.add('selected');
        else b.classList.remove('selected');
      });

      document.getElementById("formTitle").innerText = "✏️ Modifica Cliente";
      document.getElementById("btnSalva").innerText = "Aggiorna e Riposiziona";
      document.getElementById("btnAnnulla").style.display = "block";

      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.eliminaCliente = function(id) {
      if (confirm("Vuoi davvero eliminare questo cliente?")) {
        remove(ref(db, 'clienti/' + id));
      }
    };

    // Ricerca globale
    document.getElementById("ricerca").addEventListener("input", (e) => {
      const q = e.target.value.toLowerCase().trim();
      const filtrati = tuttiClienti.filter(c => 
        (c.nome && c.nome.toLowerCase().includes(q)) ||
        (c.indirizzo && c.indirizzo.toLowerCase().includes(q)) ||
        (c.zona && c.zona.toLowerCase().includes(q)) ||
        (c.orario && c.orario.includes(q)) ||
        (c.telefono && c.telefono.includes(q)) ||
        (c.note && c.note.toLowerCase().includes(q))
      );
      mostraClienti(filtrati);
      aggiornaMappa(filtrati);
    });
  </script>
</body>
</html>
